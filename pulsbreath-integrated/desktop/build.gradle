plugins {
    id 'application'
    id 'org.openjfx.javafxplugin'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '17.0.2'
    modules = [ 'javafx.controls', 'javafx.graphics', 'javafx.fxml', 'javafx.base' ]
}

dependencies {
    implementation project(':core')
    implementation 'org.xerial:sqlite-jdbc:3.45.1.0'

    // Експорт архіву у справжній файл Excel (.xlsx)
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
}

application {
    mainClass = 'com.pulsbreath.desktop.PulsBreathApp'
    applicationDefaultJvmArgs = [
        '--module-path', 'lib',
        '--add-modules', 'javafx.controls,javafx.graphics,javafx.fxml,javafx.base'
    ]
}

jar {
    manifest {
        attributes(
            'Main-Class': 'com.pulsbreath.desktop.PulsBreathApp'
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

task copyDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into "$buildDir/libs/all-libs"
}

task packageExe(type: Exec) {
    dependsOn 'installDist'
    
    def outputDir = "$buildDir/installer"
    def inputDir = "$buildDir/install/desktop/lib"
    def javaHome = System.getProperty("java.home")
    
    def mainJarName = "desktop-1.0-SNAPSHOT.jar"

    commandLine "$javaHome/bin/jpackage",
        "--type", "app-image",
        "--dest", outputDir,
        "--name", "PulsBreath",
        "--input", inputDir,
        "--main-jar", mainJarName,
        "--main-class", "com.pulsbreath.desktop.PulsBreathApp",
        "--module-path", inputDir,
        "--add-modules", "javafx.controls,javafx.graphics,javafx.fxml,javafx.base",
        "--win-shortcut",
        "--win-menu"
}
